<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Choo Choo World</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#9fdcf7;
    font-family:"Chalkboard SE","Comic Sans MS","Comic Sans",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ---------- bottom control bar ---------- */
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:6px 8px calc(8px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  #trainRow, #ctrlRow { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; pointer-events:none; }
  button { pointer-events:auto; border:none; cursor:pointer;
    font-family:inherit; font-weight:bold; border-radius:16px;
    box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .08s;
    background:#fff; color:#234; }
  button:active { transform:scale(.92) translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25); }

  .trainBtn { font-size:15px; padding:10px 12px; border-bottom:6px solid #999; min-width:86px; }
  .trainBtn.on { background:#fff48d; transform:scale(1.06); }
  .big { font-size:20px; padding:12px 18px; }
  #goBtn.running { background:#ff8a80; }
  #goBtn.stopped { background:#7ee787; }
  #whistleBtn { background:#9ad0ff; }
  #speedGrp { display:flex; gap:4px; pointer-events:auto; background:rgba(255,255,255,.55);
    border-radius:18px; padding:4px; }
  #speedGrp button { font-size:22px; padding:8px 12px; border-radius:14px; box-shadow:none; background:transparent; }
  #speedGrp button.on { background:#fff; box-shadow:0 2px 0 rgba(0,0,0,.2); }
  #camBtn { background:#e8d5ff; }

  /* ---------- top HUD ---------- */
  #hud { position:fixed; top:10px; left:12px; z-index:5; font-size:22px; color:#fff;
    background:rgba(30,60,90,.45); padding:6px 14px; border-radius:16px; }
  #hud.pop { animation:pop .5s; }
  #mute { position:fixed; top:8px; right:12px; z-index:5; font-size:22px; padding:8px 12px; border-radius:50%; }

  /* ---------- banner ---------- */
  #banner { position:fixed; top:14%; left:50%; transform:translateX(-50%); z-index:6;
    text-align:center; pointer-events:none; opacity:0; transition:opacity .4s; max-width:92vw; }
  #banner.show { opacity:1; animation:pop .5s; }
  #bannerName { font-size:clamp(30px,7vw,56px); font-weight:bold; color:#fff;
    -webkit-text-stroke:2px rgba(0,0,0,.35); text-shadow:0 4px 0 rgba(0,0,0,.25); letter-spacing:2px; }
  #bannerFact { font-size:clamp(15px,3vw,22px); color:#fff; background:rgba(30,60,90,.55);
    border-radius:14px; padding:6px 14px; display:inline-block; margin-top:6px; }
  @keyframes pop { 0%{transform:translateX(-50%) scale(.4)} 60%{transform:translateX(-50%) scale(1.15)} 100%{transform:translateX(-50%) scale(1)} }
  #hud.pop { animation:hudpop .5s; }
  @keyframes hudpop { 0%{transform:scale(.6)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

  /* ---------- splash ---------- */
  #splash { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:rgba(60,140,200,.45); backdrop-filter:blur(3px); cursor:pointer; }
  #splashCard { background:#fffdf2; border-radius:28px; padding:34px 44px; text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.25); animation:bounce 1.4s infinite; }
  #splashCard .emoji { font-size:64px; }
  #splashCard h1 { font-size:clamp(26px,6vw,44px); color:#2a5fa3; letter-spacing:2px; }
  #splashCard .tap { display:inline-block; margin-top:12px; font-size:clamp(18px,4vw,26px);
    background:#7ee787; padding:10px 24px; border-radius:18px; box-shadow:0 4px 0 rgba(0,0,0,.2); }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">⭐ 0</div>
<button id="mute" title="sound on/off">🔊</button>

<div id="banner"><div id="bannerName"></div><div id="bannerFact"></div></div>

<div id="bar">
  <div id="trainRow"></div>
  <div id="ctrlRow">
    <button id="goBtn" class="big running">🛑 STOP</button>
    <button id="whistleBtn" class="big">🎵 WHISTLE!</button>
    <div id="speedGrp">
      <button data-sp="slow" title="slow">🐢</button>
      <button data-sp="med" class="on" title="medium">🚂</button>
      <button data-sp="fast" title="fast">🚀</button>
    </div>
    <button id="camBtn" class="big">📷</button>
  </div>
</div>

<div id="splash">
  <div id="splashCard">
    <div class="emoji">🚂💨</div>
    <h1>CHOO CHOO WORLD</h1>
    <div class="tap">TAP TO START!</div>
  </div>
</div>

<script>
  // show any runtime error on screen (handy on a tablet with no devtools)
  window.addEventListener('error', function (e) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:8px;top:48px;z-index:99;background:#b00;color:#fff;padding:6px 10px;border-radius:8px;font:12px monospace;max-width:90vw;white-space:pre-wrap';
    d.textContent = '⚠ ' + e.message;
    document.body.appendChild(d);
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
